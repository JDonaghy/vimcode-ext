name = "xml"
display_name = "XML Language Support"
description = "LSP formatting and validation for XML"
version = "1.0.1"
file_extensions = [".xml", ".xsd", ".xsl", ".xslt", ".svg", ".pom"]
language_ids = ["xml", "xsl"]
workspace_markers = ["pom.xml"]

[lsp]
binary = "lemminx"
install = ""
install_linux = "mkdir -p ~/.local/bin && A=$(uname -m | sed 's/aarch64/aarch_64/;s/arm64/aarch_64/') && D=$(mktemp -d) && curl -fsSL -o \"$D/lemminx.zip\" \"$(curl -s https://api.github.com/repos/redhat-developer/vscode-xml/releases/latest | grep browser_download_url | grep \"lemminx-linux-${A}.zip\" | head -1 | cut -d'\"' -f4)\" && unzip -o \"$D/lemminx.zip\" -d \"$D\" && mv \"$D/lemminx-linux-${A}\" ~/.local/bin/lemminx && chmod +x ~/.local/bin/lemminx && rm -rf \"$D\""
install_macos = "mkdir -p ~/.local/bin && A=$(uname -m | sed 's/aarch64/aarch_64/;s/arm64/aarch_64/') && D=$(mktemp -d) && curl -fsSL -o \"$D/lemminx.zip\" \"$(curl -s https://api.github.com/repos/redhat-developer/vscode-xml/releases/latest | grep browser_download_url | grep \"lemminx-osx-${A}.zip\" | head -1 | cut -d'\"' -f4)\" && unzip -o \"$D/lemminx.zip\" -d \"$D\" && mv \"$D/lemminx-osx-${A}\" ~/.local/bin/lemminx && chmod +x ~/.local/bin/lemminx && rm -rf \"$D\""
install_windows = ""
fallback_binaries = []
args = []

scripts = []

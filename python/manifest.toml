name = "python"
display_name = "Python Language Support"
description = "LSP and debugger for Python"
version = "1.1.0"
file_extensions = [".py", ".pyi", ".pyw"]
language_ids = ["python"]
workspace_markers = ["pyproject.toml", "setup.py", "setup.cfg", "requirements.txt"]

[lsp]
binary = "pyright-langserver"
install = "npm install -g pyright"
fallback_binaries = ["basedpyright-langserver", "pylsp", "jedi-language-server"]
args = ["--stdio"]
dependencies = ["npm"]

# vimcode >= 0.14.0 (#1346): installs pyright via `npm install --prefix`
# into a private, vimcode-managed prefix -- no sudo, no global npm prefix
# (the #14 bug: a stock Linux box's system node has a root-owned global
# prefix, so `npm install -g` dies with EACCES for a normal user). The
# `pyright` npm package's own bin named `pyright-langserver` (this
# extension's `binary`) is picked up with no `binary_path` override needed.
# Older vimcode ignores an [lsp.acquire] table it doesn't understand (serde
# `default`), so `install` above stays as the tier-3 fallback until the
# minimum supported vimcode has acquire.
[lsp.acquire]
kind = "npm"
package = "pyright"

[dap]
adapter = "debugpy"
binary = "python"
install = ""
transport = "stdio"
args = ["-m", "debugpy.adapter"]

scripts = []

name = "bicep"
display_name = "Bicep Language Support"
description = "LSP for Azure Bicep infrastructure-as-code files"
version = "1.3.0"
file_extensions = [".bicep", ".bicepparam"]
language_ids = ["bicep"]
workspace_markers = ["bicepconfig.json", "main.bicep"]

[lsp]
binary = "bicep-langserver"
install = ""
install_linux = """mkdir -p ~/.local/bin ~/.local/share/bicep-langserver && \
DOTNET_MAJOR=$(dotnet --version 2>/dev/null | cut -d. -f1); \
if [ "$DOTNET_MAJOR" -ge 10 ] 2>/dev/null; then \
  BICEP_TAG=$(curl -s https://api.github.com/repos/Azure/bicep/releases/latest | grep tag_name | cut -d'"' -f4); \
else \
  BICEP_TAG="v0.39.26"; \
fi; \
echo "Installing bicep-langserver $BICEP_TAG (dotnet $DOTNET_MAJOR)"; \
curl -sL "https://github.com/Azure/bicep/releases/download/$BICEP_TAG/bicep-langserver.zip" -o /tmp/bicep-langserver.zip && \
unzip -o /tmp/bicep-langserver.zip -d ~/.local/share/bicep-langserver && \
printf '#!/bin/sh\\nexec dotnet ~/.local/share/bicep-langserver/Bicep.LangServer.dll "$@"\\n' > ~/.local/bin/bicep-langserver && \
chmod +x ~/.local/bin/bicep-langserver && \
rm /tmp/bicep-langserver.zip"""
install_macos = """mkdir -p ~/.local/bin ~/.local/share/bicep-langserver && \
DOTNET_MAJOR=$(dotnet --version 2>/dev/null | cut -d. -f1); \
if [ "$DOTNET_MAJOR" -ge 10 ] 2>/dev/null; then \
  BICEP_TAG=$(curl -s https://api.github.com/repos/Azure/bicep/releases/latest | grep tag_name | cut -d'"' -f4); \
else \
  BICEP_TAG="v0.39.26"; \
fi; \
echo "Installing bicep-langserver $BICEP_TAG (dotnet $DOTNET_MAJOR)"; \
curl -sL "https://github.com/Azure/bicep/releases/download/$BICEP_TAG/bicep-langserver.zip" -o /tmp/bicep-langserver.zip && \
unzip -o /tmp/bicep-langserver.zip -d ~/.local/share/bicep-langserver && \
printf '#!/bin/sh\\nexec dotnet ~/.local/share/bicep-langserver/Bicep.LangServer.dll "$@"\\n' > ~/.local/bin/bicep-langserver && \
chmod +x ~/.local/bin/bicep-langserver && \
rm /tmp/bicep-langserver.zip"""
# #16: bicep-langserver.zip is a multi-file .NET app (Bicep.LangServer.dll
# plus its dependency DLLs), the same zip on every platform -- not a single
# binary. That rules out `[lsp.acquire]` (vimcode#1345): its archive kinds
# extract exactly one named entry out of the archive (`extract_binary_from_
# archive`), discarding everything else, which would ship a DLL with none
# of the libraries it loads at runtime. A plain install_windows, mirroring
# install_linux/install_macos's own dotnet-major detection and wrapper
# script, is the only thing that can lay down the whole directory.
#
# The wrapper is a `.cmd` (Windows' CreateProcess auto-invokes `cmd.exe`
# for a `.bat`/`.cmd` target -- the same mechanism Node's child_process did
# before CVE-2024-27980 made it infamous) rather than a `.exe`, since there
# is no compiler here to produce a real PE binary. `resolve_command`'s
# `extra_tool_dirs` probe (`lsp_manager.rs`) only appends ".exe" when
# looking for a bare name, not ".cmd" -- so unlike the single-exe
# cpp/lua/markdown/xml fixes above (which drop straight into `~/.local/bin`
# and are found immediately), this needs `~/.local/bin` on the user's PATH
# too (added to the *user* environment, not the running process's) before
# `resolve_command`'s `where bicep-langserver` fallback can find
# `bicep-langserver.cmd` via PATHEXT. That only takes effect for a new
# process, so a fresh install needs one restart of vimcode (or its parent
# terminal) before the debugger resolves -- see the PR's SMOKE_TESTS.
install_windows = "powershell -NoProfile -Command \"$ErrorActionPreference='Stop'; $dotnetCmd = Get-Command dotnet -ErrorAction SilentlyContinue; if (-not $dotnetCmd) { throw 'bicep-langserver needs the .NET SDK; dotnet not found on PATH' }; $dotnetVer = dotnet --version; $dotnetMajor = [int]($dotnetVer.Split('.')[0]); if ($dotnetMajor -ge 10) { $tag = (Invoke-RestMethod -Uri 'https://api.github.com/repos/Azure/bicep/releases/latest').tag_name } else { $tag = 'v0.39.26' }; $shareDir = Join-Path $env:USERPROFILE '.local\\share\\bicep-langserver'; $binDir = Join-Path $env:USERPROFILE '.local\\bin'; New-Item -ItemType Directory -Force -Path $shareDir | Out-Null; New-Item -ItemType Directory -Force -Path $binDir | Out-Null; $zip = Join-Path $env:TEMP 'bicep-langserver.zip'; $url = 'https://github.com/Azure/bicep/releases/download/' + $tag + '/bicep-langserver.zip'; Invoke-WebRequest -Uri $url -OutFile $zip; Expand-Archive -Path $zip -DestinationPath $shareDir -Force; $dll = Join-Path $shareDir 'Bicep.LangServer.dll'; $q = [char]34; $wrapper = Join-Path $binDir 'bicep-langserver.cmd'; Set-Content -Path $wrapper -Value ('@echo off' + [Environment]::NewLine + 'dotnet ' + $q + $dll + $q + ' %*') -Encoding ASCII; $userPath = [Environment]::GetEnvironmentVariable('Path','User'); if (($userPath -split ';') -notcontains $binDir) { [Environment]::SetEnvironmentVariable('Path', ($userPath + ';' + $binDir), 'User'); Write-Host ('Added ' + $binDir + ' to your user PATH -- restart vimcode for bicep-langserver to be found.') }\""
fallback_binaries = []
args = ["--stdio"]
dependencies = ["dotnet"]

scripts = []

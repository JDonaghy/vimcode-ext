name = "terraform"
display_name = "Terraform Language Support"
description = "LSP for HashiCorp Terraform and OpenTofu"
version = "1.1.0"
file_extensions = [".tf", ".tfvars", ".hcl"]
language_ids = ["terraform", "terraform-vars"]
workspace_markers = ["main.tf", ".terraform", ".terraform.lock.hcl"]

[lsp]
binary = "terraform-ls"
install = ""
install_linux = "mkdir -p ~/.local/bin && V=$(curl -fsSL https://checkpoint-api.hashicorp.com/v1/check/terraform-ls | sed -E 's/.*\"current_version\":\"([^\"]+)\".*/\\1/') && A=$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/') && curl -fsSL -o /tmp/terraform-ls.zip \"https://releases.hashicorp.com/terraform-ls/${V}/terraform-ls_${V}_linux_${A}.zip\" && unzip -o /tmp/terraform-ls.zip terraform-ls -d ~/.local/bin && chmod +x ~/.local/bin/terraform-ls && rm /tmp/terraform-ls.zip"
install_macos = "brew install hashicorp/tap/terraform-ls"
install_windows = ""
fallback_binaries = ["terraform-lsp"]
args = ["serve"]

scripts = []

# vimcode >= 0.13.0 (#1345): downloads, verifies (SHA256SUMS) and unpacks
# terraform-ls itself on all three platforms, no shell/curl/unzip/sudo/PATH
# setup. Older vimcode ignores an [lsp.acquire] table it doesn't understand
# (serde `default`), so install_linux/install_macos above stay as the
# fallback until the minimum supported vimcode has acquire.
[lsp.acquire]
kind = "hashicorp-release"
product = "terraform-ls"
